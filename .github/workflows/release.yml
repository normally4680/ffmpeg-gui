name: Build and Release

on:
  push:
    tags:
      - 'v*'          # 只有推送形如 v1.0.0、v1.0.1 的 tag 时才触发
  workflow_dispatch:  # 也允许在 Actions 页面手动触发

permissions:
  contents: write     # 发布 Release 需要写权限

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'    # 用 3.12 兼容性最好，PyQt5 有预编译 wheel

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ==============================
      # 1. 打包方式一：单执行文件 (Onefile)
      # ==============================
      - name: 打包 - 单文件版 (Onefile)
        run: |
          pyinstaller -F -w --icon=app.ico --add-data "app.ico;." --name ffmpeg-gui-single main.py
          copy README.md dist\
          copy LICENSE dist\

      # ==============================
      # 2. 打包方式二：目录分离版 (Onedir)
      # ==============================
      - name: 打包 - 文件夹版 (Onedir)
        run: |
          pyinstaller -w --icon=app.ico --add-data "app.ico;." --name ffmpeg-gui-folder main.py
          copy README.md dist\ffmpeg-gui-folder\
          copy LICENSE dist\ffmpeg-gui-folder\

      # ==============================
      # 3. 分别压缩为 ZIP
      # ==============================
      - name: 压缩为 ZIP 文件
        run: |
          # 单文件版直接把 exe 和说明文档打包进 zip
          Compress-Archive -Path dist\ffmpeg-gui-single.exe, dist\README.md, dist\LICENSE -DestinationPath ffmpeg-gui-single.zip
          
          # 文件夹版把整个 ffmpeg-gui-folder 目录打包进 zip
          Compress-Archive -Path dist\ffmpeg-gui-folder\* -DestinationPath ffmpeg-gui-folder.zip

      - name: 上传 artifact（供 Actions 页面下载备份）
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-gui-builds
          path: |
            ffmpeg-gui-single.zip
            ffmpeg-gui-folder.zip

      # ==============================
      # 4. 发布 Release
      # ==============================
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ffmpeg-gui-single.zip
            ffmpeg-gui-folder.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}